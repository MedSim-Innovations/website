name: Bug report
description: Report a reproducible problem with the website.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include patient, customer, credential, or other sensitive information.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page URL
      placeholder: https://www.medsiminnovations.com/...
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Chrome 130 on Windows 11
